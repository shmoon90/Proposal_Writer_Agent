[project]
name = "proposal-writer-agent"
version = "0.1.0"
description = "SI 제안서 자동 생성 및 구축 단계 요구사항 변경관리 멀티 에이전트 시스템"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# 버전은 2026-10-15 PyPI 조회 결과 기준. 설치 전 재확인 필요 (docs/IMPLEMENTATION_PLAN.md 참고).
dependencies = [
    "claude-agent-sdk>=0.2.165,<0.3",
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "pandas>=2.2,<3",   # D-03: 2.x 고정 (R-09, streamlit 1.66은 pandas<4 허용하지만 3.x CoW/문자열 dtype 변경 회피)
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "python-docx>=1.2,<2",
    # PDF: PyMuPDF는 이 개발 PC의 앱 제어 정책이 DLL을 차단해 순수 Python 조합으로 대체 (RISK R-19)
    "pdfplumber>=0.11,<1",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    "numpy>=1.25,<3",
    "pillow>=10,<13",
    # matplotlib은 이 개발 PC의 앱 제어 정책이 렌더링 DLL(_backend_agg)을 차단해 Pillow로 대체 (RISK R-25)
    "streamlit>=1.60,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# OCR은 기본 의존성(rapidocr + onnxruntime)에 포함. 한국어 인식 모델은 첫 실행 시 다운로드된다 (D-02 확정).
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "mypy>=1.17",
    "reportlab>=4,<6",  # 테스트 픽스처(텍스트 PDF) 생성
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proposal_agent = ["agents/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*", "pptx", "pptx.*", "pdfplumber", "pdfplumber.*", "pypdfium2", "rapidocr", "rapidocr.*", "docx", "docx.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: 실제 Claude API 호출이 필요한 테스트 (기본 제외, -m llm 로 실행)",
    "slow: 느린 통합 테스트",
    "sdk: 번들 Claude Code 프로세스를 실제로 띄우는 테스트 (API 키 필요, 모델 호출 없음)",
]
addopts = "-m 'not llm'"
